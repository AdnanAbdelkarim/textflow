[pytest]
testpaths = tests
# The tests import the application as a top-level module. pytest puts the test
# directory on sys.path, not the repository root, so the root is added here.
pythonpath = .
# The browser tests start a server and drive Chromium, so they are opt-in.
addopts = -m "not slow" --ignore=tests/e2e
markers =
    slow: loads a transformer model; minutes on a cold cache
