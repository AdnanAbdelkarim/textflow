# Runs the backend smoke tests on GitHub's runners, which have far more memory
# than a laptop needs to spare for a 2 GB dependency tree.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Torch's OpenMP runtime aborts while the interpreter shuts down, which
      # replaced pytest's exit code with 134 and made a normal test failure
      # look like a crash. Single-threaded avoids the teardown race; nothing
      # here is compute-bound enough to miss the threads.
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # CPU-only PyTorch. The default Linux wheel declares the CUDA toolkit as
      # an unconditional dependency, which adds several gigabytes the runner
      # cannot use. Installing it first satisfies the requirement that
      # transformers[torch] would otherwise resolve to the GPU build.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Download NLTK data
        run: |
          python -m nltk.downloader -q \
            punkt punkt_tab \
            averaged_perceptron_tagger averaged_perceptron_tagger_eng \
            maxent_ne_chunker maxent_ne_chunker_tab \
            words

      # pytest's own exit code is unreliable here: torch's native runtime
      # aborts during interpreter shutdown and the shell sees 134 regardless
      # of the result. The suite records its real status in .pytest-status.
      - name: Run smoke tests
        run: |
          pytest -q || true
          status=$(cat .pytest-status)
          echo "pytest exit status: $status"
          exit "$status"

      # The spaCy transformer is already installed as a dependency, so the
      # slow test costs only its run time, not another download.
      - name: Run the named entity recognition test
        run: |
          pytest -q -m slow || true
          status=$(cat .pytest-status)
          echo "pytest exit status: $status"
          exit "$status"

  # File parsing for CSV, TXT, DOCX, PDF and XLSX happens in the browser, so it
  # is unreachable from the API tests and needs a real one.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Download NLTK data
        run: |
          python -m nltk.downloader -q \
            punkt punkt_tab \
            averaged_perceptron_tagger averaged_perceptron_tagger_eng \
            maxent_ne_chunker maxent_ne_chunker_tab \
            words

      - name: Run the upload format tests
        run: |
          pytest -q tests/e2e -p no:cacheprovider || true
          status=$(cat .pytest-status)
          echo "pytest exit status: $status"
          exit "$status"

  # Builds the image that gets hosted and checks it runs without the
  # transformer stack, since that is the whole point of the slim profile.
  slim-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build the slim image
        run: docker build -f deploy/slim/Dockerfile -t textflow-slim .

      - name: Report image size
        run: |
          docker image inspect textflow-slim \
            --format 'image size: {{.Size}} bytes ({{len .RootFS.Layers}} layers)'

      - name: Start it
        run: |
          docker run -d --name tf -p 8080:8080 textflow-slim
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/healthz >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:8080/healthz

      - name: The build must report no transformer support
        run: |
          caps=$(curl -fsS http://localhost:8080/api/capabilities)
          echo "$caps"
          echo "$caps" | grep -q '"transformers": *false'

      - name: Every page must render
        run: |
          for path in / overview visualizations advanced preprocessing predictive; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080/$path")
            echo "/$path -> $code"
            [ "$code" = "200" ]
          done

      # The host this is destined for provides about a gigabyte, so the
      # number matters more than the image size.
      - name: Report memory in use
        run: |
          curl -fsS -X POST http://localhost:8080/api/predict \
            -H 'Content-Type: application/json' \
            -d '{"rows":[{"text":"market shares profit revenue quarter","label":"a"},
                         {"text":"striker season coach tournament final","label":"b"},
                         {"text":"profit revenue market quarter shares","label":"a"},
                         {"text":"coach final striker season tournament","label":"b"}],
                 "model":"lr","testSize":0.5}' >/dev/null
          docker stats tf --no-stream --format 'memory: {{.MemUsage}}  ({{.MemPerc}} of host)'

      - name: Container logs
        if: always()
        run: docker logs tf
